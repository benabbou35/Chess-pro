<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شطرنج برو 7 مستويات</title><link rel="manifest" href="manifest.json"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#0b0f19;color:#fff;min-height:100vh}#app{max-width:420px;margin:0 auto;background:#121826;min-height:100vh;padding:10px 12px 90px}#status{text-align:center;margin:10px auto;background:#1e293b;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;width:fit-content;display:flex;gap:8px;align-items:center}#q{margin:6px 0;padding:7px;border-radius:9px;text-align:center;font-weight:900;display:none;background:#3b82f6;color:#fff}#online{margin:8px 0;padding:10px;background:#0f1a2e;border:1px solid #2d5bff;border-radius:12px;display:none;text-align:center}#boardWrap{display:flex;justify-content:center;margin:10px 0}#board{width:100%;max-width:380px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:10px;overflow:hidden;border:2px solid #2a3550}.sq{display:flex;align-items:center;justify-content:center;position:relative;aspect-ratio:1/1;cursor:pointer}.sq.light{background:#8ca0c0}.sq.dark{background:#445875}.sq.sel{outline:3px solid #60a5fa;outline-offset:-3px;z-index:2}.sq.hint::after{content:'';width:26%;aspect-ratio:1;background:rgba(96,165,250,.9);border-radius:50%;position:absolute}.sq.cap{box-shadow:inset 0 0 0 3px rgba(96,165,250,.95)}.p{font-size:clamp(22px,6vw,30px);line-height:1;z-index:1;font-weight:900}.p.w{color:#ffffff;text-shadow:0 1px 2px #000,0 0 1px #000}.p.b{color:#0b0f19;text-shadow:0 0 1px #fff,0 0 2px #fff}.view{display:none}.view.active{display:block}.statBox{background:#1a2236;border:1px solid #2a3550;border-radius:16px;padding:16px;margin:10px 0}.statRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a3550}#controls{display:flex;gap:6px;margin:10px 0}.ctrl{flex:1;background:#1a2236;border:1px solid #2a3550;color:#cbd5e1;padding:11px;border-radius:12px;font-size:11px;font-weight:700;text-align:center;cursor:pointer}.ctrl.active{background:#2a3a5a;border-color:#60a5fa;color:#fff}#start{width:100%;background:linear-gradient(180deg,#4a7bff,#2d5bff);color:#fff;border:none;padding:14px;border-radius:14px;font-size:16px;font-weight:900;margin-bottom:6px}.btnOnline{width:100%;background:linear-gradient(180deg,#22c55e,#16a34a);color:#fff;border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:900;margin-bottom:6px}#levelBox{background:#1a2236;border:1px solid #2a3550;border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:8px;align-items:center;font-size:12px}#levelSel{flex:1;background:#0b0f19;color:#fff;border:1px solid #2a3550;padding:10px;border-radius:10px;font-weight:700}#bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#1a2236;border-top:1px solid #2a3550;display:flex;justify-content:space-around;padding:8px 6px 12px;z-index:10}.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#8a96b0;cursor:pointer}.nav.active{color:#60a5fa}</style></head><body><div id="app"><div id="v-play" class="view active"><div id="status">• <span id="turnTxt">دور الأبيض</span> <span id="lvlBadge" style="background:#2d5bff;padding:3px 8px;border-radius:10px;font-size:10px">500-800</span></div><div id="q">كش!</div><div id="levelBox">🎯 البوت: <select id="levelSel" onchange="changeLevel()"><option value="650">🟢 500-800 مبتدئ بزاف</option><option value="950">🔵 800-1100 مبتدئ</option><option value="1300">🟡 1100-1500 سهل</option><option value="1600">🟠 1500-1700 متوسط</option><option value="1850">🔴 1700-2000 قوي</option><option value="2250">🟣 2000-2500 خبير</option><option value="2800">⚫ 2500-3000 أسطوري</option></select></div><div id="online"><div id="onTxt"></div><input id="onLink" style="width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #2a3550;background:#0b0f19;color:#60a5fa;font-size:11px;display:none" readonly><button id="onCopy" onclick="copyLink()" style="margin-top:6px;width:100%;padding:8px;border-radius:8px;background:#2d5bff;color:#fff;border:none;display:none">📋 نسخ</button></div><div id="boardWrap"><div id="board"></div></div><div id="controls"><div class="ctrl" onclick="setMode2p()" id="c2">👥 لاعبان</div><div class="ctrl" onclick="setColor('b')" id="cB">● أسود</div><div class="ctrl active" onclick="setColor('w')" id="cW">● أبيض</div></div><button id="start" onclick="newGame()">◂ بدء اللعبة</button><button class="btnOnline" onclick="createOnline()">🌐 إنشاء رابط أونلاين</button></div><div id="v-stats" class="view"><div class="statBox"><div class="statRow"><span>🎮 مباريات</span><b id="sGames">0</b></div><div class="statRow"><span>✅ فوز</span><b id="sWin">0</b></div><div class="statRow"><span>❌ خسارة</span><b id="sLose">0</b></div><div class="statRow"><span>🎯 المستوى</span><b id="sLvl">650</b></div></div></div><div id="v-profile" class="view"><div class="statBox" style="text-align:center"><h3>لاعب</h3></div></div><div id="v-rank" class="view"><div class="statBox"><h3>📈 المستويات 7</h3></div></div></div><div id="bottom"><div class="nav active" onclick="switchView('play')" id="n-play">🏠<span>لعب</span></div><div class="nav" onclick="switchView('rank')" id="n-rank">🏆<span>تصنيف</span></div><div class="nav" onclick="switchView('stats')" id="n-stats">📊<span>إحصائيات</span></div><div class="nav" onclick="switchView('profile')" id="n-profile">👤<span>حسابي</span></div></div><script>
const S={'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙','k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'};
let B,T='w',sel=null,moves=[],player='w',mode='bot',thinking=false,flip=0,botElo=650;
let C={wK:1,wQ:1,bK:1,bQ:1},E=null;
let stats=JSON.parse(localStorage.getItem('chessStats')||'{"games":0,"win":0,"lose":0}');
let peer=null,conn=null,onlineMode=false;
function init(){B=[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];T='w';C={wK:1,wQ:1,bK:1,bQ:1};E=null;}
function clone(b){return b.map(r=>[...r]);}
function findKing(b,col){let k=col=='w'?'K':'k';for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]==k)return{r,c};return null;}
function isAttacked(b,r,c,byWhite){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){let p=b[rr][cc];if(!p)continue;if((p==p.toUpperCase())!=byWhite)continue;let ms=rawMoves(b,rr,cc,true);if(ms.some(m=>m.r==r&&m.c==c))return true;}return false;}
function rawMoves(b,r,c,attack){let p=b[r][c];if(!p)return[];let out=[],W=p==p.toUpperCase(),d=W?-1:1;function add(nr,nc){if(nr<0||nr>7||nc<0||nc>7)return 0;let t=b[nr][nc];if(t==''){out.push({r:nr,c:nc});return 1;}let tw=t==t.toUpperCase();if(tw!=W){out.push({r:nr,c:nc,x:1});return 0;}return 0;}let L=p.toLowerCase();if(L=='p'){if(!attack){if(b[r+d]&&b[r+d][c]==''){out.push({r:r+d,c:c});if((W&&r==6||!W&&r==1)&&b[r+d*2][c]=='')out.push({r:r+d*2,c:c,D:1});}for(let dc of[-1,1]){let nr=r+d,nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8){let t=b[nr][nc];if(t&&(t==t.toUpperCase())!=W)out.push({r:nr,c:nc,x:1});}}if(E&&r+d==E.r&&Math.abs(c-E.c)==1)out.push({r:E.r,c:E.c,x:1,E:1});}else{for(let dc of[-1,1]){let nr=r+d,nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8)out.push({r:nr,c:nc});}}}else{if(L=='r'||L=='q')for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<8;i++)if(!add(r+dr*i,c+dc*i))break;if(L=='b'||L=='q')for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]])for(let i=1;i<8;i++)if(!add(r+dr*i,c+dc*i))break;if(L=='n')for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);if(L=='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);if(!attack){if(W&&r==7&&c==4){if(C.wK&&b[7][5]==''&&b[7][6]==''&&!isAttacked(b,7,4,false)&&!isAttacked(b,7,5,false))out.push({r:7,c:6,O:'K'});if(C.wQ&&b[7][1]==''&&b[7][2]==''&&b[7][3]==''&&!isAttacked(b,7,4,false)&&!isAttacked(b,7,3,false))out.push({r:7,c:2,O:'Q'});}if(!W&&r==0&&c==4){if(C.bK&&b[0][5]==''&&b[0][6]==''&&!isAttacked(b,0,4,true)&&!isAttacked(b,0,5,true))out.push({r:0,c:6,O:'K'});if(C.bQ&&b[0][1]==''&&b[0][2]==''&&b[0][3]==''&&!isAttacked(b,0,4,true)&&!isAttacked(b,0,3,true))out.push({r:0,c:2,O:'Q'});}}}}return out;}
function legalMoves(b,r,c){let ps=rawMoves(b,r,c,false),ok=[],W=b[r][c]==b[r][c].toUpperCase();for(let m of ps){let nb=clone(b);if(m.E)nb[r][m.c]='';nb[m.r][m.c]=nb[r][c];nb[r][c]='';if(m.O){if(m.O=='K'){nb[m.r][m.c-1]=nb[m.r][7];nb[m.r][7]='';}else{nb[m.r][m.c+1]=nb[m.r][0];nb[m.r][0]='';}}let k=findKing(nb,W?'w':'b');if(!k)continue;if(isAttacked(nb,k.r,k.c,!W))continue;ok.push(m);}return ok;}
function allMoves(col){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=B[r][c];if(!p)continue;if((p==p.toUpperCase())!=(col=='w'))continue;let ms=legalMoves(B,r,c);for(let m of ms)a.push({fr:r,fc:c,...m});}return a;}
function inCheck(col){let k=findKing(B,col);if(!k)return false;return isAttacked(B,k.r,k.c,col=='w'?false:true);}
function pieceVal(p){let v={p:1,n:3,b:3,r:5,q:9,k:100};return v[p.toLowerCase()]||0;}
function evaluate(b){let s=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=b[r][c];if(!p)continue;let v=pieceVal(p);if(p==p.toUpperCase())s+=v;else s-=v;}return s;}
function minimax(b,depth,alpha,beta,isMax,cObj,eObj,turn){if(depth==0)return evaluate(b);let col=turn;let movesList=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=b[r][c];if(!p)continue;if((p==p.toUpperCase())!=(col=='w'))continue;let oldC=C,oldE=E;C=cObj;E=eObj;let ms=legalMoves(b,r,c);C={wK:1,wQ:1,bK:1,bQ:1};E=null;for(let m of ms)movesList.push({fr:r,fc:c,...m});}if(!movesList.length){let k=findKing(b,col);if(k&&isAttacked(b,k.r,k.c,col=='w'?false:true))return isMax?-999:999;return 0;}if(isMax){let max=-Infinity;for(let m of movesList){let nb=clone(b);if(m.E)nb[m.fr][m.c]='';nb[m.r][m.c]=nb[m.fr][m.fc];nb[m.fr][m.fc]='';if(m.O){if(m.O=='K'){nb[m.r][m.c-1]=nb[m.r][7];nb[m.r][7]='';}else{nb[m.r][m.c+1]=nb[m.r][0];nb[m.r][0]='';}}if(nb[m.r][m.c]&&nb[m.r][m.c].toLowerCase()=='p'&&(m.r==0||m.r==7))nb[m.r][m.c]=col=='w'?'Q':'q';let sc=minimax(nb,depth-1,alpha,beta,false,cObj,eObj,col=='w'?'b':'w');if(sc>max)max=sc;alpha=Math.max(alpha,sc);if(beta<=alpha)break;}return max;}else{let min=Infinity;for(let m of movesList){let nb=clone(b);if(m.E)nb[m.fr][m.c]='';nb[m.r][m.c]=nb[m.fr][m.fc];nb[m.fr][m.fc]='';if(m.O){if(m.O=='K'){nb[m.r][m.c-1]=nb[m.r][7];nb[m.r][7]='';}else{nb[m.r][m.c+1]=nb[m.r][0];nb[m.r][0]='';}}if(nb[m.r][m.c]&&nb[m.r][m.c].toLowerCase()=='p'&&(m.r==0||m.r==7))nb[m.r][m.c]=col=='w'?'Q':'q';let sc=minimax(nb,depth-1,alpha,beta,true,cObj,eObj,col=='w'?'b':'w');if(sc<min)min=sc;beta=Math.min(beta,sc);if(beta<=alpha)break;}return min;}}
function render(){let el=document.getElementById('board');el.innerHTML='';for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){let r=flip?7-dr:dr,c=flip?7-dc:dc;let d=document.createElement('div');d.className='sq '+((r+c)%2==0?'light':'dark');if(sel&&sel.r==r&&sel.c==c)d.classList.add('sel');let mv=moves.find(x=>x.r==r&&x.c==c);if(mv){if(B[r][c]!=''||mv.E)d.classList.add('cap');else d.classList.add('hint');}let p=B[r][c];if(p){let s=document.createElement('span');s.className='p '+(p==p.toUpperCase()?'w':'b');s.textContent=S[p];d.appendChild(s);}d.onclick=()=>clickSq(r,c);el.appendChild(d);}document.getElementById('q').style.display=inCheck(T)?'block':'none';document.getElementById('turnTxt').textContent=thinking?'البوت كيفكر...':(onlineMode?(player==T?'دورك':'دور الخصم'):(T=='w'?'دور الأبيض':'دور الأسود'));document.getElementById('sGames').textContent=stats.games;document.getElementById('sWin').textContent=stats.win;document.getElementById('sLose').textContent=stats.lose;document.getElementById('sLvl').textContent=botElo;let badge={650:'500-800',950:'800-1100',1300:'1100-1500',1600:'1500-1700',1850:'1700-2000',2250:'2000-2500',2800:'2500-3000'};document.getElementById('lvlBadge').textContent=badge[botElo]||botElo;}
function clickSq(r,c){if(thinking)return;if(onlineMode&&T!=player)return;if(!onlineMode&&mode=='bot'&&T!=player)return;let p=B[r][c];let own=p&&((T=='w'&&p==p.toUpperCase())||(T=='b'&&p==p.toLowerCase()));if(own){sel={r,c};moves=legalMoves(B,r,c);render();return;}if(sel&&moves.some(m=>m.r==r&&m.c==c)){let mm=moves.find(m=>m.r==r&&m.c==c);doMove(sel.r,sel.c,mm.r,mm.c,mm,true);sel=null;moves=[];}}
function doMove(fr,fc,tr,tc,mm,send){let p=B[fr][fc];if(p=='K'){C.wK=0;C.wQ=0;}if(p=='k'){C.bK=0;C.bQ=0;}if(p=='R'&&fr==7&&fc==0)C.wQ=0;if(p=='R'&&fr==7&&fc==7)C.wK=0;if(p=='r'&&fr==0&&fc==0)C.bQ=0;if(p=='r'&&fr==0&&fc==7)C.bK=0;if(mm.E)B[fr][tc]='';B[tr][tc]=B[fr][fc];B[fr][fc]='';if(mm.O){if(mm.O=='K'){B[tr][tc-1]=B[tr][7];B[tr][7]='';}else{B[tr][tc+1]=B[tr][0];B[tr][0]='';}}if(B[tr][tc].toLowerCase()=='p'&&(tr==0||tr==7))B[tr][tc]=T=='w'?'Q':'q';if(mm.D)E={r:fr+(T=='w'?-1:1),c:fc};else E=null;if(onlineMode&&send&&conn&&conn.open){conn.send({type:'move',B:B.map(r=>[...r]),C:{...C},E,T:T=='w'?'b':'w'});}T=T=='w'?'b':'w';let am=allMoves(T);if(am.length==0){stats.games++;if(inCheck(T)){if(T=='w')stats.lose++;else stats.win++;alert('كش مات! '+(T=='w'?'الأسود ربح':'الأبيض ربح'));}else alert('تعادل!');localStorage.setItem('chessStats',JSON.stringify(stats));newGame();return;}render();localStorage.setItem('chessStats',JSON.stringify(stats));if(!onlineMode&&mode=='bot')setTimeout(bot,400);}
function bot(){if(onlineMode||mode!='bot'||thinking)return;let am=allMoves(T);if(!am.length||T==player)return;thinking=true;render();let depth=1,blunderRate=0;if(botElo<=800){depth=1;blunderRate=0.8;}else if(botElo<=1100){depth=1;blunderRate=0.6;}else if(botElo<=1500){depth=1;blunderRate=0.35;}else if(botElo<=1700){depth=2;blunderRate=0.15;}else if(botElo<=2000){depth=2;blunderRate=0.05;}else if(botElo<=2500){depth=3;blunderRate=0.02;}else{depth=4;blunderRate=0;}setTimeout(()=>{if(Math.random()<blunderRate){am.sort(()=>Math.random()-0.5);let pick=am[0];doMove(pick.fr,pick.fc,pick.r,pick.c,pick,false);thinking=false;render();return;}let candidates=am.map(m=>{let nb=clone(B);if(m.E)nb[m.fr][m.c]='';nb[m.r][m.c]=nb[m.fr][m.fc];nb[m.fr][m.fc]='';if(m.O){if(m.O=='K'){nb[m.r][m.c-1]=nb[m.r][7];nb[m.r][7]='';}else{nb[m.r][m.c+1]=nb[m.r][0];nb[m.r][0]='';}}if(nb[m.r][m.c]&&nb[m.r][m.c].toLowerCase()=='p'&&(m.r==0||m.r==7))nb[m.r][m.c]=T=='w'?'Q':'q';let score=evaluate(nb);if(depth>1){let isMax=T=='b';score=minimax(nb,depth-1,-10000,10000,isMax,C,E,T=='w'?'b':'w');}return{move:m,score:score};});if(T=='b'){candidates.sort((a,b)=>a.score-b.score);}else{candidates.sort((a,b)=>b.score-a.score);}let topN=1;if(botElo>=2500)topN=1;else if(botElo>=2000)topN=2;else if(botElo>=1700)topN=3;else topN=5;let top=candidates.slice(0,topN);let best=top[Math.floor(Math.random()*top.length)].move;doMove(best.fr,best.fc,best.r,best.c,best,false);thinking=false;render();}, botElo>=2500?800:400);}
function changeLevel(){botElo=parseInt(document.getElementById('levelSel').value);localStorage.setItem('botElo',botElo);render();newGame();}
function createOnline(){document.getElementById('online').style.display='block';document.getElementById('onTxt').textContent='⏳ كنصايب...';if(!peer){peer=new Peer();peer.on('open',id=>{let link=location.origin+location.pathname+'?join='+id;document.getElementById('onTxt').textContent='✅ صيفط هاد الرابط:';document.getElementById('onLink').value=link;document.getElementById('onLink').style.display='block';document.getElementById('onCopy').style.display='block';player='w';mode='online';onlineMode=true;flip=0;newGame();});peer.on('connection',c=>{conn=c;setupConn();});}}
function joinOnline(hid){document.getElementById('online').style.display='block';document.getElementById('onTxt').textContent='⏳ كنتصل...';if(!peer)peer=new Peer();peer.on('open',()=>{conn=peer.connect(hid);conn.on('open',()=>{onlineMode=true;player='b';mode='online';flip=1;document.getElementById('onTxt').textContent='✅ متصل!';newGame();setupConn();});});}
function setupConn(){conn.on('data',d=>{if(d.type=='move'){B=d.B.map(r=>[...r]);C=d.C;E=d.E;T=d.T;render();}});}
function copyLink(){let l=document.getElementById('onLink');l.select();document.execCommand('copy');alert('تم النسخ');}
function setColor(c){if(onlineMode)return;player=c;mode='bot';flip=c=='b'?1:0;document.getElementById('cW').classList.toggle('active',c=='w');document.getElementById('cB').classList.toggle('active',c=='b');document.getElementById('c2').classList.remove('active');newGame();}
function setMode2p(){if(onlineMode){onlineMode=false;if(peer){peer.destroy();peer=null;conn=null;}document.getElementById('online').style.display='none';}mode='2p';flip=0;document.getElementById('c2').classList.add('active');document.getElementById('cW').classList.remove('active');document.getElementById('cB').classList.remove('active');newGame();}
function newGame(){init();T='w';sel=null;moves=[];thinking=false;document.getElementById('q').style.display='none';render();if(!onlineMode&&mode=='bot'&&T!=player)setTimeout(bot,500);}
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById('v-'+v).classList.add('active');document.getElementById('n-'+v).classList.add('active');}
(function(){let saved=localStorage.getItem('botElo');if(saved){botElo=parseInt(saved);document.getElementById('levelSel').value=botElo;}let j=new URLSearchParams(location.search).get('join');if(j)setTimeout(()=>joinOnline(j),600);if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}})();
init();render();
</script></body></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شطرنج برو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#161512;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{color:#81b64c;margin:10px;font-size:26px}
#board{width:94vw;max-width:400px;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #3a3a3a;border-radius:6px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;position:relative}
.light{background:#f0d9b5}.dark{background:#769656}
.sel{background:#f6f669 !important}
.hint::after{content:'';width:18px;height:18px;background:rgba(0,0,0,.35);border-radius:50%;position:absolute}
.cap::after{content:'';width:90%;height:90%;border:4px solid rgba(0,0,0,.35);border-radius:50%;position:absolute}
button{background:#81b64c;color:#000;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;margin:5px}
</style>
</head>
<body>
<h1>♔ شطرنج برو - ضد البوت</h1>
<div id="board"></div>
<div id="msg" style="margin:10px;color:#81b64c;font-weight:bold;height:20px"></div>
<div>
<button onclick="newGame()">جديدة</button>
<button onclick="undo()" style="background:#3a3a3a;color:#fff">تراجع</button>
<button onclick="toggleBot()" id="botBtn" style="background:#3a3a3a;color:#fff">البوت: شغال</button>
</div>
<script>
const S={'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙','k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'};
let B,T='w',sel=null,moves=[],hist=[],botOn=true,thinking=false;
function init(){B=[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];}
function render(){const e=document.getElementById('board');e.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let d=document.createElement('div');d.className='sq '+((r+c)%2==0?'light':'dark');if(sel&&sel.r==r&&sel.c==c)d.classList.add('sel');let mv=moves.find(m=>m.r==r&&m.c==c);if(mv){if(B[r][c]!='')d.classList.add('cap');else d.classList.add('hint');}let p=B[r][c];if(p){d.textContent=S[p];d.style.color=p==p.toUpperCase()?'#fff':'#000';d.style.textShadow=p==p.toUpperCase()?'0 1px 3px #000':'';}d.onclick=()=>clk(r,c);e.appendChild(d);}}
function clk(r,c){if(thinking)return;let p=B[r][c];let own=p&&((T=='w'&&p==p.toUpperCase())||(T=='b'&&p==p.toLowerCase()));if(own){sel={r,c};moves=getMoves(r,c);render();return;}if(sel&&moves.some(m=>m.r==r&&m.c==c)){doMove(sel.r,sel.c,r,c);}sel=null;moves=[];render();if(botOn&&T=='b')setTimeout(botMove,400);}
function getMoves(r,c){let p=B[r][c];if(!p)return[];let out=[],white=p==p.toUpperCase(),dir=white?-1:1;function add(nr,nc){if(nr<0||nr>7||nc<0||nc>7)return false;let t=B[nr][nc];if(t==''){out.push({r:nr,c:nc});return true;}let tw=t==t.toUpperCase();if(tw!=white){out.push({r:nr,c:nc});return false;}return false;}let l=p.toLowerCase();if(l=='p'){if(B[r+dir]&&B[r+dir][c]==''){out.push({r:r+dir,c:c});if((white&&r==6||!white&&r==1)&&B[r+dir*2][c]=='')out.push({r:r+dir*2,c:c});}for(let dc of[-1,1]){let nr=r+dir,nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8){let t=B[nr][nc];if(t&&(t==t.toUpperCase())!=white)out.push({r:nr,c:nc});}}}else{if(l=='r'||l=='q')for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<8;i++)if(!add(r+dr*i,c+dc*i))break;if(l=='b'||l=='q')for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]])for(let i=1;i<8;i++)if(!add(r+dr*i,c+dc*i))break;if(l=='n')for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);if(l=='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);}return out;}
function doMove(fr,fc,tr,tc){hist.push(JSON.parse(JSON.stringify(B)));B[tr][tc]=B[fr][fc];B[fr][fc]='';if(B[tr][tc].toLowerCase()=='p'&&(tr==0||tr==7))B[tr][tc]=T=='w'?'Q':'q';T=T=='w'?'b':'w';render();checkEnd();}
function botMove(){if(T!='b')return;thinking=true;document.getElementById('msg').textContent='البوت كيفكر...';setTimeout(()=>{let all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=B[r][c];if(p&&p==p.toLowerCase()){let ms=getMoves(r,c);for(let m of ms)all.push({fr:r,fc:c,tr:m.r,tc:m.c,val:B[m.r][m.c]!=''?10:0});}}if(all.length==0){thinking=false;return;}all.sort((a,b)=>b.val-a.val);let best=all.slice(0,5);let pick=best[Math.floor(Math.random()*best.length)];doMove(pick.fr,pick.fc,pick.tr,pick.tc);thinking=false;document.getElementById('msg').textContent='';},300);}
function checkEnd(){let wk=false,bk=false;for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(B[r][c]=='K')wk=true;if(B[r][c]=='k')bk=true;}if(!bk){document.getElementById('msg').textContent='🎉 ربحتي!';botOn=false;}if(!wk){document.getElementById('msg').textContent='البوت ربح!';}}
function newGame(){init();T='w';sel=null;moves=[];hist=[];document.getElementById('msg').textContent='';render();}
function undo(){if(hist.length){B=hist.pop();T=T=='w'?'b':'w';render();}}
function toggleBot(){botOn=!botOn;document.getElementById('botBtn').textContent=botOn?'البوت: شغال':'البوت: طافي';if(botOn&&T=='b')botMove();}
init();render();
</script>
</body>
</html>

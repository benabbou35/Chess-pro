<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>شطرنج برو</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0f19"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#0b0f19;color:#fff;min-height:100vh}#app{max-width:420px;margin:0 auto;background:#121826;min-height:100vh;padding:10px 12px 90px}#status{text-align:center;margin:10px auto;background:#1e293b;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;width:fit-content}#q{margin:6px 0;padding:7px;border-radius:9px;text-align:center;font-weight:900;display:none;background:#3b82f6;color:#fff}#online{margin:8px 0;padding:10px;background:#0f1a2e;border:1px solid #2d5bff;border-radius:12px;display:none;text-align:center}#boardWrap{display:flex;justify-content:center;margin:10px 0}#board{width:100%;max-width:380px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:10px;overflow:hidden;border:2px solid #2a3550}.sq{display:flex;align-items:center;justify-content:center;position:relative;aspect-ratio:1/1;line-height:1;cursor:pointer}.sq.light{background:#5a6d8a}.sq.dark{background:#2f3b4f}.sq.sel{outline:3px solid #60a5fa;outline-offset:-3px;z-index:2}.sq.hint::after{content:'';width:26%;aspect-ratio:1;background:rgba(96,165,250,.85);border-radius:50%;position:absolute}.sq.cap{box-shadow:inset 0 0 0 3px rgba(96,165,250,.9)}.p{font-size:clamp(20px,5.8vw,28px);line-height:1;z-index:1}.view{display:none}.view.active{display:block}.statBox{background:#1a2236;border:1px solid #2a3550;border-radius:16px;padding:16px;margin:10px 0}.statRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a3550}.btn2{width:100%;background:#1a2236;border:1px solid #2a3550;color:#fff;padding:14px;border-radius:12px;margin:8px 0;font-weight:700}#controls{display:flex;gap:6px;margin:10px 0}.ctrl{flex:1;background:#1a2236;border:1px solid #2a3550;color:#cbd5e1;padding:11px;border-radius:12px;font-size:12px;font-weight:700;text-align:center;cursor:pointer}.ctrl.active{background:#2a3a5a;border-color:#60a5fa;color:#fff}#start{width:100%;background:linear-gradient(180deg,#4a7bff,#2d5bff);color:#fff;border:none;padding:14px;border-radius:14px;font-size:16px;font-weight:900;margin-bottom:6px}.btnOnline{width:100%;background:linear-gradient(180deg,#22c55e,#16a34a);color:#fff;border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:900;margin-bottom:6px}#bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#1a2236;border-top:1px solid #2a3550;display:flex;justify-content:space-around;padding:8px 6px 12px;z-index:10}.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#8a96b0;cursor:pointer}.nav.active{color:#60a5fa}</style></head><body><div id="app"><div id="v-play" class="view active"><div id="status">• <span id="turnTxt">دور الأبيض</span></div><div id="q"></div><div id="online"><div id="onTxt"></div><input id="onLink" style="width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #2a3550;background:#0b0f19;color:#60a5fa;font-size:11px;display:none" readonly><button id="onCopy" onclick="copyLink()" style="margin-top:6px;width:100%;padding:8px;border-radius:8px;background:#2d5bff;color:#fff;border:none;display:none">📋 نسخ</button></div><div id="boardWrap"><div id="board"></div></div><div id="controls"><div class="ctrl" onclick="setMode2p()" id="c2">👥 لاعبان</div><div class="ctrl" onclick="setColor('b')" id="cB">● أسود</div><div class="ctrl active" onclick="setColor('w')" id="cW">● أبيض</div></div><button id="start" onclick="newGame()">◂ بدء اللعبة</button><button class="btnOnline" onclick="createOnline()">🌐 إنشاء رابط أونلاين</button></div><div id="v-rank" class="view"><div class="statBox"><h3>🏆 تصنيف - أوفلاين</h3><p style="color:#8a96b0;font-size:12px;margin-top:8px">كتخدم بلا إنترنت ضد البوت</p></div></div><div id="v-stats" class="view"><div class="statBox"><div class="statRow"><span>🎮 مباريات</span><b id="sGames">0</b></div><div class="statRow"><span>✅ فوز</span><b id="sWin">0</b></div><div class="statRow"><span>❌ خسارة</span><b id="sLose">0</b></div></div></div><div id="v-profile" class="view"><div class="statBox" style="text-align:center"><h3 id="pName">لاعب</h3><div id="pElo">1200 ELO - يعمل بلا إنترنت ✅</div></div></div></div><div id="bottom"><div class="nav active" onclick="switchView('play')" id="n-play">🏠<span>لعب</span></div><div class="nav" onclick="switchView('rank')" id="n-rank">🏆<span>تصنيف</span></div><div class="nav" onclick="switchView('stats')" id="n-stats">📊<span>إحصائيات</span></div><div class="nav" onclick="switchView('profile')" id="n-profile">👤<span>حسابي</span></div></div><script>
const S={'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙','k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'};let B,T='w',sel=null,moves=[],player='w',mode='bot',thinking=false,flip=0,C={wK:1,wQ:1,bK:1,bQ:1},E=null;let stats=JSON.parse(localStorage.getItem('chessStats')||'{"games":0,"win":0,"lose":0,"cap":0,"elo":1200,"name":"لاعب"}');let peer=null,conn=null,onlineMode=false;
function init(){B=[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];T='w';C={wK:1,wQ:1,bK:1,bQ:1};E=null;}
function Cl(b){return b.map(r=>[...r])}function FK(b,c){let k=c=='w'?'K':'k';for(let r=0;r<8;r++)for(let cc=0;cc<8;c++)if(b[r][cc]==k)return{r,c};for(let r=0;r<8;r++)for(let cc=0;cc<8;cc++)if(b[r][cc]==k)return{r,c};return null}function At(b,r,c,W){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){let p=b[rr][cc];if(!p)continue;if((p==p.toUpperCase())!=W)continue;let ms=Ps(b,rr,cc,1);if(ms.some(m=>m.r==r&&m.c==c))return 1}return 0}
function Ps(b,r,c,atk){let p=b[r][c];if(!p)return[];let o=[],W=p==p.toUpperCase(),d=W?-1:1;function Ad(nr,nc){if(nr<0||nr>7||nc<0||nc>7)return 0;let t=b[nr][nc];if(t==''){o.push({r:nr,c:nc});return 1}let tw=t==t.toUpperCase();if(tw!=W){o.push({r:nr,c:nc,x:1});return 0}return 0}let l=p.toLowerCase();if(l=='p'){if(!atk){if(b[r+d]&&b[r+d][c]==''){o.push({r:r+d,c:c});if((W&&r==6||!W&&r==1)&&b[r+d*2][c]=='')o.push({r:r+d*2,c:c,D:1})}for(let dc of[-1,1]){let nr=r+d,nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8){let t=b[nr][nc];if(t&&(t==t.toUpperCase())!=W)o.push({r:nr,c:nc,x:1})}}if(E&&r+d==E.r&&Math.abs(c-E.c)==1)o.push({r:E.r,c:E.c,x:1,E:1})}else{for(let dc of[-1,1]){let nr=r+d,nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8)o.push({r:nr,c:nc})}}}else{if(l=='r'||l=='q')for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<8;i++)if(!Ad(r+dr*i,c+dc*i))break;if(l=='b'||l=='q')for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]])for(let i=1;i<8;i++)if(!Ad(r+dr*i,c+dc*i))break;if(l=='n')for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])Ad(r+dr,c+dc);if(l=='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)Ad(r+dr,c+dc);if(!atk){if(W&&r==7&&c==4){if(C.wK&&b[7][5]==''&&b[7][6]==''&&!At(b,7,4,0)&&!At(b,7,5,0)&&!At(b,7,6,0))o.push({r:7,c:6,O:'K'});if(C.wQ&&b[7][1]==''&&b[7][2]==''&&b[7][3]==''&&!At(b,7,4,0)&&!At(b,7,3,0)&&!At(b,7,2,0))o.push({r:7,c:2,O:'Q'});}if(!W&&r==0&&c==4){if(C.bK&&b[0][5]==''&&b[0][6]==''&&!At(b,0,4,1)&&!At(b,0,5,1)&&!At(b,0,6,1))o.push({r:0,c:6,O:'K'});if(C.bQ&&b[0][1]==''&&b[0][2]==''&&b[0][3]==''&&!At(b,0,4,1)&&!At(b,0,3,1)&&!At(b,0,2,1))o.push({r:0,c:2,O:'Q'});}}}}return o}
function GL(b,r,c){let ps=Ps(b,r,c,0),o=[],W=b[r][c]==b[r][c].toUpperCase();for(let mm of ps){let nb=Cl(b);if(mm.E)nb[r][mm.c]='';nb[mm.r][mm.c]=nb[r][c];nb[r][c]='';if(mm.O){if(mm.O=='K'){nb[mm.r][mm.c-1]=nb[mm.r][7];nb[mm.r][7]=''}else{nb[mm.r][mm.c+1]=nb[mm.r][0];nb[mm.r][0]=''}}let k=null;let kk=W?'K':'k';for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++)if(nb[rr][cc]==kk)k={r:rr,c:cc};if(!k)continue;if(At(nb,k.r,k.c,!W))continue;o.push(mm)}return o}function GA(col){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=B[r][c];if(!p)continue;let W=p==p.toUpperCase();if((col=='w'&&!W)||(col=='b'&&W))continue;let ms=GL(B,r,c);for(let mm of ms)a.push({fr:r,fc:c,...mm})}return a}function IC(col){let kk=col=='w'?'K':'k';let k=null;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(B[r][c]==kk)k={r,c};if(!k)return 0;return At(B,k.r,k.c,col=='w'?0:1)}
function render(){const e=document.getElementById('board');e.innerHTML='';for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){let r=flip?7-dr:dr,c=flip?7-dc:dc;let d=document.createElement('div');d.className='sq '+((r+c)%2==0?'light':'dark');if(sel&&sel.r==r&&sel.c==c)d.classList.add('sel');let mv=moves.find(m=>m.r==r&&m.c==c);if(mv){if(B[r][c]!=''||mv.E)d.classList.add('cap');else d.classList.add('hint');}let p=B[r][c];if(p){let s=document.createElement('span');s.className='p';s.textContent=S[p];d.appendChild(s);}d.onclick=()=>clk(r,c);e.appendChild(d);}let ch=IC(T);document.getElementById('q').style.display=ch?'block':'none';document.getElementById('q').textContent=ch?'⚠️ كش!':'';document.getElementById('turnTxt').textContent=thinking?'البوت كيفكر...':(onlineMode?(player==T?'دورك':'دور الخصم'):(T=='w'?'دور الأبيض':'دور الأسود'));document.getElementById('sGames').textContent=stats.games;document.getElementById('sWin').textContent=stats.win;document.getElementById('sLose').textContent=stats.lose;document.getElementById('pName').textContent=stats.name;}
function clk(r,c){if(thinking)return;if(onlineMode&&T!=player)return;if(!onlineMode&&mode=='bot'&&T!=player)return;let p=B[r][c];let own=p&&((T=='w'&&p==p.toUpperCase())||(T=='b'&&p==p.toLowerCase()));if(own){sel={r,c};moves=GL(B,r,c);render();return;}if(sel&&moves.some(m=>m.r==r&&m.c==c)){let mm=moves.find(m=>m.r==r&&m.c==c);doMove(sel.r,sel.c,mm.r,mm.c,mm,true);sel=null;moves=[];}}
function doMove(fr,fc,tr,tc,me,send){let p=B[fr][fc];let ep=me&&me.E;let oc=me&&me.O;let db=me&&me.D;if(p=='K'){C.wK=0;C.wQ=0}if(p=='k'){C.bK=0;C.bQ=0}if(p=='R'&&fr==7&&fc==0)C.wQ=0;if(p=='R'&&fr==7&&fc==7)C.wK=0;if(p=='r'&&fr==0&&fc==0)C.bQ=0;if(p=='r'&&fr==0&&fc==7)C.bK=0;if(ep)B[fr][tc]='';B[tr][tc]=B[fr][fc];B[fr][fc]='';if(oc){if(oc=='K'){B[tr][tc-1]=B[tr][7];B[tr][7]=''}else{B[tr][tc+1]=B[tr][0];B[tr][0]=''}}if(B[tr][tc].toLowerCase()=='p'&&(tr==0||tr==7))B[tr][tc]=T=='w'?'Q':'q';if(db)E={r:fr+(T=='w'?-1:1),c:fc};else E=null;if(onlineMode&&send&&conn&&conn.open)conn.send({type:'move',B:B.map(r=>[...r]),C:JSON.parse(JSON.stringify(C)),E,T:T=='w'?'b':'w'});T=T=='w'?'b':'w';let al=GA(T);if(al.length==0){stats.games++;if(IC(T)){if(T=='w')stats.lose++;else stats.win++;}localStorage.setItem('chessStats',JSON.stringify(stats));alert(IC(T)?'♔ كش مات!':'تعادل!');newGame();return;}render();localStorage.setItem('chessStats',JSON.stringify(stats));if(!onlineMode&&mode=='bot')setTimeout(botMove,400);}
function botMove(){if(onlineMode||mode!='bot'||thinking)return;let al=GA(T);if(!al.length||T==player)return;thinking=true;render();setTimeout(()=>{al.sort((a,b)=>{let sa=B[a.tr][a.tc]!=''?10:0,sb=B[b.tr][b.tc]!=''?10:0;return sb-sa+Math.random()});let pick=al[0];doMove(pick.fr,pick.fc,pick.tr,pick.tc,pick,false);thinking=false;render();},600);}
function createOnline(){document.getElementById('online').style.display='block';document.getElementById('onTxt').textContent='⏳ كنصايب...';if(!peer){peer=new Peer();peer.on('open',id=>{let link=location.origin+location.pathname+'?join='+id;document.getElementById('onTxt').textContent='✅ صيفط هاد الرابط:';document.getElementById('onLink').value=link;document.getElementById('onLink').style.display='block';document.getElementById('onCopy').style.display='block';player='w';mode='online';onlineMode=true;flip=0;newGame();});peer.on('connection',c=>{conn=c;setupConn();});}}
function joinOnline(hid){document.getElementById('online').style.display='block';document.getElementById('onTxt').textContent='⏳ كنتصل...';if(!peer)peer=new Peer();peer.on('open',()=>{conn=peer.connect(hid);conn.on('open',()=>{onlineMode=true;player='b';mode='online';flip=1;document.getElementById('onTxt').textContent='✅ متصل!';newGame();setupConn();});});}
function setupConn(){conn.on('data',d=>{if(d.type=='move'){B=d.B.map(r=>[...r]);C=d.C;E=d.E;T=d.T;render();}});}
function copyLink(){let l=document.getElementById('onLink');l.select();document.execCommand('copy');alert('تم النسخ');}
function setColor(c){if(onlineMode)return;player=c;mode='bot';flip=c=='b'?1:0;document.getElementById('cW').classList.toggle('active',c=='w');document.getElementById('cB').classList.toggle('active',c=='b');document.getElementById('c2').classList.remove('active');newGame();}
function setMode2p(){if(onlineMode){onlineMode=false;if(peer){peer.destroy();peer=null;conn=null;}document.getElementById('online').style.display='none';}mode='2p';flip=0;document.getElementById('c2').classList.add('active');document.getElementById('cW').classList.remove('active');document.getElementById('cB').classList.remove('active');newGame();}
function newGame(){init();T='w';sel=null;moves=[];thinking=false;document.getElementById('q').style.display='none';render();if(!onlineMode&&mode=='bot'&&T!=player)setTimeout(botMove,500);}
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById('v-'+v).classList.add('active');document.getElementById('n-'+v).classList.add('active');}
(function(){let j=new URLSearchParams(location.search).get('join');if(j)setTimeout(()=>joinOnline(j),600);if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}})();
init();render();
</script></body></html>
